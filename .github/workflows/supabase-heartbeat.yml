name: ping-supabase

on:
  schedule:
    - cron: '0 0 */3 * *' # Runs every 3 days

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat Request
        run: |
          curl -X GET "https://mxndnjosakuozorkkthc.supabase.co/rest/v1/links?select=id&limit=1" \
               -H "apikey: ${SUPABASE_ANON_KEY}" \
               -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
